<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title"><title id="title">Twee Ethernetnetwerken verbonden door een router</title><rect width="1000" height="440" fill="#f8fafc"/>
<style>text{font-family:Arial,sans-serif;fill:#15243b} .small{font-size:15px} .name{font-size:18px;font-weight:bold}</style>
<line x1="210" y1="82" x2="345" y2="170" stroke="#526b84" stroke-width="3"/>
<line x1="210" y1="342" x2="345" y2="245" stroke="#526b84" stroke-width="3"/>
<line x1="420" y1="207" x2="470" y2="207" stroke="#526b84" stroke-width="3"/>
<line x1="680" y1="207" x2="740" y2="207" stroke="#526b84" stroke-width="3"/>
<line x1="815" y1="245" x2="850" y2="300" stroke="#526b84" stroke-width="3"/>
<rect x="30" y="40" width="180" height="85" rx="10" fill="white" stroke="#245c84" stroke-width="2"/>
<text class="name" x="120.0" y="69" text-anchor="middle">Computer A</text>
<text class="small" x="120.0" y="93" text-anchor="middle">192.168.10.10</text>
<rect x="30" y="300" width="180" height="85" rx="10" fill="white" stroke="#245c84" stroke-width="2"/>
<text class="name" x="120.0" y="329" text-anchor="middle">Computer B</text>
<text class="small" x="120.0" y="353" text-anchor="middle">192.168.10.20</text>
<rect x="270" y="170" width="150" height="75" rx="10" fill="white" stroke="#245c84" stroke-width="2"/>
<text class="name" x="345.0" y="199" text-anchor="middle">Switch links</text>
<rect x="470" y="140" width="210" height="135" rx="10" fill="white" stroke="#245c84" stroke-width="2"/>
<text class="name" x="575.0" y="169" text-anchor="middle">Router</text>
<text class="small" x="575.0" y="193" text-anchor="middle">Links: 192.168.10.1</text>
<text class="small" x="575.0" y="214" text-anchor="middle">Rechts: 192.168.20.1</text>
<rect x="740" y="170" width="150" height="75" rx="10" fill="white" stroke="#245c84" stroke-width="2"/>
<text class="name" x="815.0" y="199" text-anchor="middle">Switch rechts</text>
<rect x="760" y="300" width="180" height="85" rx="10" fill="white" stroke="#245c84" stroke-width="2"/>
<text class="name" x="850.0" y="329" text-anchor="middle">Computer C</text>
<text class="small" x="850.0" y="353" text-anchor="middle">192.168.20.10</text>
<text class="small" x="330" y="415" text-anchor="middle">Links: 192.168.10.0/24</text>
<text class="small" x="785" y="415" text-anchor="middle">Rechts: 192.168.20.0/24</text>
</svg>