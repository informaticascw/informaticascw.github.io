<text class="small" x="550" y="135" text-anchor="middle">10.0.0.0/30</text>
<text class="small" x="500" y="415" text-anchor="middle">Teken in Filius alleen de gevraagde voorbeeldclients; plan wel de volledige capaciteit.</text>
