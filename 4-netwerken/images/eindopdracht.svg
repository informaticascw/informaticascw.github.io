<text class="small" x="140.0" y="333" text-anchor="middle">4 servers + router</text>
<text class="small" x="140.0" y="354" text-anchor="middle">192.168.50.0 / ?</text>
<rect x="320" y="160" width="190" height="115" rx="10" fill="white" stroke="#245c84" stroke-width="2"/>
<text class="name" x="415.0" y="189" text-anchor="middle">R1</text>
<text class="small" x="415.0" y="213" text-anchor="middle">Drie interfaces</text>
<text class="small" x="415.0" y="234" text-anchor="middle">Kies geldige adressen</text>
<rect x="590" y="160" width="180" height="115" rx="10" fill="white" stroke="#245c84" stroke-width="2"/>
