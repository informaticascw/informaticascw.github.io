<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title"><title id="title">Topologie voor de praktische eindopdracht</title><rect width="1000" height="440" fill="#f8fafc"/>
<style>text{font-family:Arial,sans-serif;fill:#15243b} .small{font-size:15px} .name{font-size:18px;font-weight:bold}</style>
<line x1="255" y1="110" x2="320" y2="190" stroke="#526b84" stroke-width="3"/>
<line x1="255" y1="325" x2="320" y2="245" stroke="#526b84" stroke-width="3"/>
<line x1="510" y1="217" x2="590" y2="217" stroke="#526b84" stroke-width="3"/>
